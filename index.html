<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="欢迎来到 PBK 的个人网站，在这里了解我的个人信息、兴趣爱好和作品。
      PBK's personal website featuring my projects and interests."
    />

    <title>PB.Kong的个人网站</title>

    <link rel="icon" href="./images/icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Caacupe+One&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 统一管理页面中经常重复使用的颜色和间距。 */
      :root {
        --background: #1e7cda;
        --text-color: #fffefee5;
      }

      /* 让元素声明的宽高包含 padding 和 border，尺寸更容易计算。 */
      * {
        box-sizing: border-box;
        /* border: 1px solid black; */
      }

      html,
      body {
        margin: 0;
        height: 100%;

        display: flex;
        flex-direction: column;
      }

      body {
        font-family: "Caacupe One", Arial, "Microsoft YaHei", sans-serif;
      }

      /* 整个页面 */
      .page {
        display: flex;
        flex-direction: column;
      }
      /* top area */
      .topbox {
        position: relative;
        display: flex;
        align-items: center;
        height: 90px;
        background-color: var(--background);
      }
      .name {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        margin: 0;
        text-align: center;

        font-family: "Caacupe One", sans-serif;
        font-size: 50px;
        font-weight: 400;
        color: white;
      }
      .nav {
        display: flex;
        justify-content: space-evenly;
      }
      .nav-button {
        font-size: 25px;
        background-color: transparent;
        color: var(--text-color);

        border: none;
        cursor: pointer;
        margin-right: 20px;
        margin-left: 20px;
      }
      .nav-word {
        width: 80px;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-color);
        font-size: 20px;
        text-decoration: none;
      }
      /* main area */
      .main-area {
        min-width: 0;
        padding: 0 20px;
      }
      .main-content {
        width: 100%;
        padding: 0 15%;
        background-color: #ec9292;
      }
      .main-video {
        display: block;
        width: 100%;
        height: auto;
      }
      /* footer */
      .site-footer {
        flex: 1;
        min-height: 50px;
        height: auto;

        background-color: var(--background);
        padding: 10px 20px 20px;

        display: flex;
        position: relative;
        justify-content: space-between;
        align-items: start;
      }
      .footer-text {
        margin: 0;
        font-size: 10px;
        font-family: Arial, "Microsoft YaHei", sans-serif;
        color: var(--text-color);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <!-- top area -->
      <header class="topbox">
        <!-- navigation bar -->
        <button class="nav-button" onclick="toggleNav()">☰</button>
        <nav class="nav">
          <a href="#" class="nav-word"> 项目 </a>
          <a href="#" class="nav-word"> 简介 </a>
          <a href="#" class="nav-word"> 文章 </a>
          <a href="#" class="nav-word"> 足迹 </a>
        </nav>
        <!-- website name -->
        <h1 class="name">PBk Sakura</h1>
      </header>
      <!-- main area -->

      <main class="main-area">
        <!-- Main content goes here -->
        <div class="main-content">
          <video
            class="main-video"
            autoplay
            muted
            preload="metadata"
            playsinline
            loop
          >
            <source src="./videos/sakura.mp4" type="video/mp4" />

            你的浏览器不支持 HTML 视频。这里有一个<a
              href="sakura.mp4"
              download="sakura.mp4"
              >视频</a
            >链接。
          </video>
        </div>
      </main>
    </div>
    <!-- footer -->
    <footer class="site-footer">
      <div style="display: flex; flex-direction: row; gap: 30px">
        <p class="footer-text">&copy; 2024 PBK. All rights reserved.</p>
        <p class="footer-text">
          <a
            href="mailto:info@pbksakura.com"
            style="color: var(--text-color); text-decoration: none"
          >
            联系方式
          </a>
        </p>
      </div>

      <div
        style="
          width: 20%;
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
        "
        class="footer-text"
      >
        探索他的艺术作品，设计，实验，文章，以及一起体验美好生活吧
      </div>

      <p class="footer-text">音乐 <>开<></p>
    </footer>
  </body>
</html>
